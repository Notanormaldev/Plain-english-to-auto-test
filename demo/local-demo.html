<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Demo Portal - PHPTRAVELS</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 40px 20px;
      color: #1e293b;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    h1 {
      font-size: 22px;
      margin-top: 0;
      color: #0f172a;
    }
    .demo-box {
      background: #e0f2fe;
      border-left: 4px solid #0284c7;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .demo-box code {
      background: #bae6fd;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
    }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #0369a1;
    }
    #dashboard-view {
      display: none;
    }
    .stats-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
    }
    .success-alert {
      background: #dcfce7;
      color: #166534;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 500;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login View -->
    <div id="login-view">
      <h1>PHPTRAVELS Customer Login</h1>
      <div class="demo-box">
        <strong>Demo Customer Credentials:</strong><br/>
        Email: <code>customer@phptravels.com</code><br/>
        Password: <code>democustomer</code>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="customer@phptravels.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" id="submitBtn">Log In</button>
      </form>
    </div>

    <!-- Customer Dashboard View -->
    <div id="dashboard-view">
      <div class="success-alert">
        Welcome back, Demo Customer!
      </div>
      <h1>Customer Dashboard</h1>
      <p style="color: #64748b;">Welcome to your booking portal dashboard overview.</p>
      
      <div class="stats-card">
        <strong>Upcoming Bookings:</strong> 2 Active Reservations
      </div>
      <div class="stats-card">
        <strong>Wallet Balance:</strong> $450.00 USD
      </div>

      <button onclick="logout()" style="background: #64748b; margin-top: 24px;">Log Out</button>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (email === 'customer@phptravels.com' && pass === 'democustomer') {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'block';
        window.history.pushState({}, '', '#dashboard');
      } else {
        alert('Invalid credentials! Please use the demo credentials.');
      }
    }

    function logout() {
      document.getElementById('dashboard-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'block';
      window.history.pushState({}, '', '#login');
    }
  </script>
</body>
</html>
